<text x="20" y="80" font-size="15" fill="#cbd5e1">ขนาด · พิกัด · การใช้งาน</text>
<text x="20" y="108" font-size="15" fill="#cbd5e1">เช็กสเปกก่อนเลือกหน้าตาล้อ</text>
